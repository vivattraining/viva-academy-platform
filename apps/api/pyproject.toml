[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academy-api"
version = "0.1.0"
description = "Standalone academy backend for VIVA and future white-label institutes."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "email-validator>=2.2.0",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
# Install via `pip install -e .[test]` for local pytest runs and in CI.
# Kept out of `dependencies` so Vercel's production function image stays
# slim (no pytest at runtime).
test = [
  "pytest>=8.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
# All test files live in apps/api/tests/ and import `from app.X import Y`.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers --strict-config"
filterwarnings = [
  "ignore::DeprecationWarning:passlib.*",
  "ignore::DeprecationWarning:sqlalchemy.*",
]
